<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
            background-color: antiquewhite;
            width: 90vw;
            height: 60vh;

        }

        .circle {
            background-color: rgb(134, 190, 238);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            animation: animateX 4s linear infinite,
                       animateY 1s ease-out infinite alternate;

        }

        @keyframes animateX {
            from{
                left: 0%;
            }
            to{
                left: 100%;
            }
        }

        @keyframes animateY {
            from{
                bottom: 0%;
            }
            to{
                bottom: 100%;
            }
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="circle translate"></div>
    </div>
</body>

</html>
