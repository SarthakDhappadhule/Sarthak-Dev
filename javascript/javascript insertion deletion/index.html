<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript insertion deletion</title>
    <style>
        .box{
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Hey i am a box
        </div>

        <main>
            <!-- INSERTED HERE: It becomes a sibling BEFORE the container -->
            <div class="created">This is the created div using the <b> javascript. <b></div>

            <div class="container">
                <p>Existing paragraph inside the container.</p>
            </div>
        </main>

        <main>
            <div class="container">
                <p>Existing paragraph inside the container.</p>
            </div>
        </main>

    </div>

    <script src="../javascript insertion deletion/script.js"></script>
</body>

</html>
