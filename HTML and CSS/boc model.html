<!DOCTYPE html>
<html lang="en">   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            margin: 20px;
            padding: 10px;
            border: 2px solid black; /* this is the individual size of the box */
            /* this is the combination of content, padding, and border not margin so this code is used*/
            box-sizing: border-box;
        }
        .box1 {
            background-color: lightblue;
        }
        .box2 {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>Box Model</h1>
    <div class="box box1">I am box 1</div>
    <div class="box box2">I am box 2</div>
</body>
</html>
