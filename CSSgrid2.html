<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Grid Layout</title>
    <style>
        body {
            margin: 20px;
            font-family: sans-serif;
        }

        .boxes {
            border: 5px solid black;
            display: grid;
            height: 400px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            grid-template-areas:
                "nav nav nav"
                "slide article info";
            gap: 20px;
            column-gap: 10px;
            row-gap: 10px;
            padding: 10px;
            /* grid-template-columns: repeat(4., minmax(100px)); */
        }

        .item {
            border: 2px solid red;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .item-1 {
            grid-area: nav;
        }

        .item-2 {
            grid-area: slide;
        }

        .item-3 {
            grid-area: article;
        }

        .item-4 {
            grid-area: info;
        }
    </style>
</head>

<body>

    <div class="boxes">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
    </div>

</body>

</html>
