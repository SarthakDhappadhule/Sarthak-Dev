<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
            background-color: antiquewhite;
            width: 90vw;
            height: 60vh;

        }

        .circle {
            background-color: rgb(134, 190, 238);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            animation: bounce 0.6s ease-in infinite alternate,
                       movement 4s linear infinite;

        }

          @keyframes bounce {
            0% {
                /* Top of the bounce: normal shape, lifted high */
                transform: translateY(-150px) scaleX(1) scaleY(1);
            }
            /* 90% {
                Just before hitting the floor: stretched out vertically due to speed
                transform: translateY(0px) scaleX(0.8) scaleY(1.2);
            }
            100% {
                Hitting the floor: squashed flat vertically due to impact
                transform: translateY(0px) scaleX(1.3) scaleY(0.7);
            } */
        }

        @keyframes movement {
            0% {
                left: 0%;
            }

            100% {
                left: calc(100% - 80px);
                /* transform: translateX(300px); */
            }


        }

    </style>
</head>

<body>
    <div class="container">
        <div class="circle translate"></div>
    </div>
</body>

</html>
